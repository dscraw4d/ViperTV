services:
  vipertv:
    container_name: vipertv
    build:
      context: .
      dockerfile: Dockerfile
    image: vipertv:1.5.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
      VIPERTV_DATA_DIR: /data
      VIPERTV_SECONDARY_BACKUP_DIR: /backup2
      VIPERTV_BACKUP_KEEP: ${VIPERTV_BACKUP_KEEP:-60}
      VIPERTV_AUTO_SCAN_HOURS: ${VIPERTV_AUTO_SCAN_HOURS:-6}
      VIPERTV_PUBLIC_BASE_URL: ${VIPERTV_PUBLIC_BASE_URL:-}
      VIPERTV_PLEX_MAX_VIDEO_BITRATE: ${VIPERTV_PLEX_MAX_VIDEO_BITRATE:-20000}
      VIPERTV_PLEX_VIDEO_RESOLUTION: ${VIPERTV_PLEX_VIDEO_RESOLUTION:-1920x1080}
      VIPERTV_PLEX_SYNC_PAGE_SIZE: ${VIPERTV_PLEX_SYNC_PAGE_SIZE:-500}
      VIPERTV_PLEX_AUTO_SYNC_DAYS: ${VIPERTV_PLEX_AUTO_SYNC_DAYS:-3}
      VIPERTV_PLEX_AUTO_SYNC_HOUR: ${VIPERTV_PLEX_AUTO_SYNC_HOUR:-7}
      VIPERTV_PLEX_AUTO_SYNC_TIMEZONE: ${VIPERTV_PLEX_AUTO_SYNC_TIMEZONE:-UTC}
      VIPERTV_TVDB_REFRESH_DAYS: ${VIPERTV_TVDB_REFRESH_DAYS:-30}
      VIPERTV_PLUTO_REGION: ${VIPERTV_PLUTO_REGION:-us}
      VIPERTV_PLUTO_NUMBER_OFFSET: ${VIPERTV_PLUTO_NUMBER_OFFSET:-1000}
      VIPERTV_PLUTO_AUTO_SYNC_HOURS: ${VIPERTV_PLUTO_AUTO_SYNC_HOURS:-24}
      VIPERTV_DEFAULT_STREAM_PROFILE: ${VIPERTV_DEFAULT_STREAM_PROFILE:-software}
      VIPERTV_TRANSCODE_PRESET: ${VIPERTV_TRANSCODE_PRESET:-veryfast}
      VIPERTV_VIDEO_BITRATE: ${VIPERTV_VIDEO_BITRATE:-5000k}
      VIPERTV_AUDIO_BITRATE: ${VIPERTV_AUDIO_BITRATE:-192k}
      VIPERTV_SHARED_STREAM_GRACE_SECONDS: ${VIPERTV_SHARED_STREAM_GRACE_SECONDS:-15}
      VIPERTV_SHARED_STREAM_QUEUE_CHUNKS: ${VIPERTV_SHARED_STREAM_QUEUE_CHUNKS:-24}
      VIPERTV_LIVE_PROBE_SIZE: ${VIPERTV_LIVE_PROBE_SIZE:-131072}
      VIPERTV_LIVE_ANALYZE_US: ${VIPERTV_LIVE_ANALYZE_US:-250000}
      VIPERTV_HLS_SEGMENT_SECONDS: ${VIPERTV_HLS_SEGMENT_SECONDS:-1}
    ports:
      - "${VIPERTV_PORT:-8409}:8409"
    volumes:
      - ./data:/data
      - ./backups:/backup2
      - "${VIPERTV_MEDIA_DIR:-./media}:/media:ro"
